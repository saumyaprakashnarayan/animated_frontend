<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trayaksh.ai — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css">
  
  <style>
    /* Admin specific styles leveraging tokens.css */
    :root {
      --panel-glass: rgba(10, 26, 15, 0.4);
      --glass-border: rgba(200, 255, 0, 0.15);
    }
    
    body {
      padding: 0;
      margin: 0;
      background: var(--ink);
      color: var(--text-primary);
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
    }
    
    .admin-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 3rem 2rem;
      position: relative;
      z-index: 10;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    
    .header-left {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }
    
    h1 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 3.5rem;
      margin: 0;
      color: var(--text-primary);
      text-shadow: 0 0 20px rgba(200, 255, 0, 0.1);
    }
    
    h1 span {
      color: var(--accent);
    }
    
    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    
    /* Search Bar */
    .search-box {
      position: relative;
    }
    .search-box input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 40px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      width: 250px;
      outline: none;
      transition: all 0.3s ease;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(200,255,0,0.1);
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--text-muted);
      width: 14px;
      height: 14px;
    }
    
    /* Buttons */
    .btn {
      background: var(--panel-glass);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      background: var(--accent);
      color: var(--ink);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(200,255,0,0.3);
    }
    
    .btn-outline { background: transparent; color: var(--accent); border-color: var(--accent); }
    .btn-outline:hover { background: var(--accent); color: var(--ink); }
    
    .btn-danger { color: #ff5555; border-color: rgba(255,85,85,0.3); }
    .btn-danger:hover { background: #ff5555; color: white; border-color: #ff5555; box-shadow: 0 0 15px rgba(255,85,85,0.3); }
    
    /* Stat Cards */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    
    .stat-card {
      background: var(--panel-glass);
      border: 1px solid var(--glass-border);
      padding: 2rem;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }
    
    .stat-card:hover { transform: translateY(-5px); border-color: rgba(200,255,0,0.3); }
    
    .stat-card h3 {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 0 0 1rem 0;
    }
    
    .stat-card .value {
      font-size: 3rem;
      font-family: 'Instrument Serif', serif;
      color: var(--accent);
      line-height: 1;
    }
    
    /* Table Container */
    .table-container {
      background: var(--panel-glass);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      overflow-x: auto;
      backdrop-filter: blur(10px);
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    
    th, td { padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    th {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }
    
    td { color: var(--text-subheading); font-size: 0.9rem; vertical-align: top; }
    
    tr:last-child td { border-bottom: none; }
    
    tr:hover td { background: rgba(200, 255, 0, 0.03); }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(200, 255, 0, 0.1);
      color: var(--accent);
      border: 1px solid rgba(200, 255, 0, 0.2);
      border-radius: 20px;
      font-size: 0.7rem;
      white-space: nowrap;
      font-family: 'Space Mono', monospace;
    }
    
    .msg-preview {
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      color: var(--text-dim);
      transition: color 0.2s;
    }
    .msg-preview:hover { color: var(--accent); }
    
    /* Skeletons */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
      height: 1rem;
      margin-bottom: 0.5rem;
    }
    @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    
    /* Modals */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 13, 7, 0.85); z-index: 1000; align-items: center; justify-content: center;
      backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; display: flex; }
    
    .modal-content {
      background: var(--ink-dim); padding: 2.5rem; border: 1px solid var(--glass-border);
      border-radius: 8px; width: 100%; max-width: 500px; transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    
    .modal-content h3 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; margin: 0 0 1.5rem 0; color: var(--accent); font-weight: 400; font-style: italic; }
    .modal-content p { color: var(--text-subheading); line-height: 1.6; font-size: 0.95rem; margin-bottom: 2rem; white-space: pre-wrap;}
    
    .modal-content input {
      width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
      padding: 1rem; color: var(--text-primary); border-radius: 4px; margin-bottom: 1rem; outline: none; box-sizing: border-box;
    }
    .modal-content input:focus { border-color: var(--accent); }
    
    /* Toasts */
    #toastContainer { position: fixed; bottom: 2rem; right: 2rem; z-index: 2000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast {
      background: var(--ink-mid); border: 1px solid var(--accent); color: var(--text-primary);
      padding: 1rem 1.5rem; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      font-size: 0.85rem; font-family: 'Space Mono', monospace; transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 0.75rem;
    }
    .toast.show { transform: translateX(0); }
    .toast.error { border-color: #ff5555; }
    
    .empty-state { padding: 4rem 2rem; text-align: center; color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

  <!-- Background Canvas for consistency -->
  <div id="bg-canvas"></div>
  
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="admin-container">
    <div class="header">
      <div class="header-left">
        <h1>Trayaksh<span>.ai</span></h1>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="Search leads..." onkeyup="handleSearch()">
        </div>
        <button class="btn" onclick="exportToCSV()">Export CSV</button>
        <button class="btn" onclick="fetchContacts()">Refresh</button>
        <button class="btn btn-outline" onclick="openPwdModal()">Password</button>
        <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
      </div>
    </div>
    
    <div class="stat-cards">
      <div class="stat-card">
        <h3>Total Leads</h3>
        <div class="value" id="totalLeads">-</div>
      </div>
      <div class="stat-card">
        <h3>New This Week</h3>
        <div class="value" id="newLeads">-</div>
      </div>
      <div class="stat-card">
        <h3>System Status</h3>
        <div class="value" style="font-size: 1.5rem; display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; font-family: 'DM Sans', sans-serif;">
          <div style="width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 15px var(--accent);"></div>
          Online
        </div>
      </div>
    </div>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date / Time</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Company</th>
            <th>Service Area</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Skeletons initially -->
          <tr><td colspan="6"><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></td></tr>
          <tr><td colspan="6"><div class="skeleton"></div><div class="skeleton" style="width:80%"></div></td></tr>
          <tr><td colspan="6"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal-overlay" id="pwdModal">
    <div class="modal-content">
      <h3>Change Password</h3>
      <div style="position: relative; width: 100%; margin-bottom: 0.5rem;">
        <input type="password" id="oldPwd" placeholder="Old Password" style="width: 100%; padding-right: 45px; box-sizing: border-box; margin-bottom: 0;">
        <span onclick="togglePwd('oldPwd', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-dim); font-size: 0.75rem; font-family: 'Space Mono', monospace; text-transform: uppercase; user-select: none;">Show</span>
      </div>
      <div style="position: relative; width: 100%; margin-bottom: 0.5rem;">
        <input type="password" id="newPwd" placeholder="New Password" style="width: 100%; padding-right: 45px; box-sizing: border-box; margin-bottom: 0;">
        <span onclick="togglePwd('newPwd', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-dim); font-size: 0.75rem; font-family: 'Space Mono', monospace; text-transform: uppercase; user-select: none;">Show</span>
      </div>
      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button class="btn" onclick="handleChangePassword()">Save Password</button>
        <button class="btn btn-outline" onclick="closeModal('pwdModal')">Cancel</button>
      </div>
    </div>
  </div>
  
  <!-- Message Modal -->
  <div class="modal-overlay" id="msgModal">
    <div class="modal-content">
      <h3>Message Full View</h3>
      <p id="fullMessageText"></p>
      <div style="display: flex; gap: 1rem; margin-top: 1rem;">
        <button class="btn btn-outline" onclick="closeModal('msgModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script>
    let allContacts = [];
    
    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = 'Hide';
      } else {
        input.type = 'password';
        btn.innerText = 'Show';
      }
    }

    function showToast(message, type='success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icon = type === 'success' ? '✓' : '⚠';
      toast.innerHTML = `<strong style="color:${type==='success'?'var(--accent)':'#ff5555'}">${icon}</strong> ${message}`;
      
      container.appendChild(toast);
      
      // Trigger reflow to play animation
      setTimeout(() => toast.classList.add('show'), 10);
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
    
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
      setTimeout(() => document.getElementById(id).classList.add('active'), 10);
    }
    
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      setTimeout(() => document.getElementById(id).style.display = 'none', 300);
    }
    
    function openPwdModal() { openModal('pwdModal'); document.getElementById('oldPwd').value = ''; document.getElementById('newPwd').value = ''; }
    
    function viewMessage(text) {
      // Decode encoded quotes back if needed or just display text
      document.getElementById('fullMessageText').innerText = text.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
      openModal('msgModal');
    }

    async function handleLogout() {
      await fetch('%VITE_API_BASE_URL%/api/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login.html';
    }
    
    async function handleChangePassword() {
      const oldPwd = document.getElementById('oldPwd').value;
      const newPwd = document.getElementById('newPwd').value;
      
      if(!oldPwd || !newPwd) return showToast('Please fill both fields', 'error');
      
      try {
        const res = await fetch('%VITE_API_BASE_URL%/api/change_password', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
        });
        
        if(res.ok) {
          showToast('Password updated successfully');
          closeModal('pwdModal');
        } else {
          const data = await res.json();
          showToast(data.message || 'Error changing password', 'error');
        }
      } catch (e) {
        showToast('Connection error', 'error');
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const totalEl = document.getElementById('totalLeads');
      const newEl = document.getElementById('newLeads');
      
      // Only update stats if we're rendering the full dataset (not searching)
      if (data.length === allContacts.length) {
        totalEl.innerText = data.length;
        const oneWeekAgo = new Date();
        oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
        newEl.innerText = data.filter(d => new Date(d.submittedAt) > oneWeekAgo).length;
      }
      
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No submissions found.</td></tr>';
        return;
      }
      
      tbody.innerHTML = '';
      data.forEach(contact => {
        let dateStr = contact.submittedAt;
        if (!dateStr.includes('T') && !dateStr.includes('Z')) {
          // Legacy dates didn't have timezone, assume UTC
          dateStr = dateStr.replace(' ', 'T') + 'Z';
        }
        const date = new Date(dateStr);
        
        const dateFormatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const timeUTC = date.toLocaleTimeString('en-US', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit' }) + ' UTC';
        const timeIST = date.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) + ' IST';
        
        const formattedDate = dateFormatted + 
          '<br><span style="color: var(--text-dim); font-size: 0.70rem; font-family:\'Space Mono\',monospace; display: block; margin-top: 4px;">' + timeUTC + '</span>' +
          '<span style="color: var(--accent); font-size: 0.70rem; font-family:\'Space Mono\',monospace; display: block; margin-top: 2px;">' + timeIST + '</span>';
        
        // Escape special chars for onclick attribute
        const safeMsg = (contact.message || '').replace(/"/g, '&quot;').replace(/'/g, '&apos;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '\\n');
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formattedDate}</td>
          <td><strong style="color: var(--text-primary); font-weight:500;">${contact.firstName} ${contact.lastName}</strong></td>
          <td><a href="mailto:${contact.email}" style="color: var(--accent); text-decoration: none;">${contact.email}</a></td>
          <td>${contact.company || '<span style="color:var(--text-dim)">-</span>'}</td>
          <td>${contact.service ? `<span class="badge">${contact.service}</span>` : '<span style="color:var(--text-dim)">-</span>'}</td>
          <td>
            ${contact.message ? `<div class="msg-preview" onclick="viewMessage('${safeMsg}')">${contact.message}</div>` : '<span style="color:var(--text-dim)">-</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
      
      attachCursorEvents();
    }

    async function fetchContacts() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="6"><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></td></tr><tr><td colspan="6"><div class="skeleton"></div><div class="skeleton" style="width:80%"></div></td></tr>';
      
      try {
        const response = await fetch('%VITE_API_BASE_URL%/api/contacts', { credentials: 'include' });
        if (response.status === 401) { window.location.href = '/login.html'; return; }
        allContacts = await response.json();
        
        // Reset search
        document.getElementById('searchInput').value = '';
        renderTable(allContacts);
        showToast('Data refreshed');
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state" style="color: #ff5555;">Error connecting to database.</td></tr>';
        showToast('Failed to load contacts', 'error');
      }
    }
    
    function handleSearch() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      if(!term) {
        renderTable(allContacts);
        return;
      }
      const filtered = allContacts.filter(c => 
        (c.firstName + ' ' + c.lastName).toLowerCase().includes(term) ||
        (c.email || '').toLowerCase().includes(term) ||
        (c.company || '').toLowerCase().includes(term) ||
        (c.service || '').toLowerCase().includes(term)
      );
      renderTable(filtered);
    }
    
    function exportToCSV() {
      if(allContacts.length === 0) return showToast('No data to export', 'error');
      
      const headers = ['ID', 'Date', 'First Name', 'Last Name', 'Email', 'Company', 'Service', 'Message'];
      const term = document.getElementById('searchInput').value.toLowerCase();
      
      const currentData = term ? 
                          allContacts.filter(c => 
                            (c.firstName + ' ' + c.lastName).toLowerCase().includes(term) || 
                            (c.email||'').toLowerCase().includes(term) || 
                            (c.company||'').toLowerCase().includes(term) ||
                            (c.service||'').toLowerCase().includes(term)
                          ) 
                          : allContacts;
                          
      const rows = currentData.map(c => [
        c.id, c.submittedAt, c.firstName, c.lastName, c.email, 
        c.company || '', c.service || '', (c.message || '').replace(/\n/g, ' ')
      ]);
      
      let csvContent = "data:text/csv;charset=utf-8," + 
                       headers.join(",") + "\\n" + 
                       rows.map(e => e.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(",")).join("\\n");
                       
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `trayaksh_leads_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      showToast('Export successful');
    }
    
    // Initial fetch
    fetchContacts();

    // Cursor Logic
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2, ringX = mouseX, ringY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      cursor.style.left = mouseX + 'px'; cursor.style.top = mouseY + 'px';
    });
    
    function renderRing() {
      ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15;
      ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
      requestAnimationFrame(renderRing);
    }
    requestAnimationFrame(renderRing);
    
    function attachCursorEvents() {
      const interactables = document.querySelectorAll('button, a, tr, input, .msg-preview');
      interactables.forEach(el => {
        if(el.dataset.cursorBound) return;
        el.dataset.cursorBound = "true";
        el.addEventListener('mouseenter', () => {
          cursor.classList.add('hovering');
          ring.style.width = '56px'; ring.style.height = '56px'; ring.style.opacity = '0.8';
        });
        el.addEventListener('mouseleave', () => {
          cursor.classList.remove('hovering');
          ring.style.width = '36px'; ring.style.height = '36px'; ring.style.opacity = '0.5';
        });
      });
    }
    const observer = new MutationObserver(attachCursorEvents);
    observer.observe(document.body, { childList: true, subtree: true });
    
  </script>
</body>
</html>
