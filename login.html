<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trayaksh.ai — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css">
  
  <style>
    :root {
      /* Premium Cyber Obsidian & Emerald */
      --ink: #020606;
      --ink-dim: #040a08;
      --ink-mid: #091712;
      --accent: #00f59b;
      --accent-highlight: #c8ff00;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --glass-surface: rgba(8, 20, 15, 0.72);
      --glass-border: rgba(0, 245, 155, 0.2);
      --glass-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      --shadow-luxury: 0 24px 48px -12px rgba(0, 0, 0, 0.85);
      --glow-emerald: 0 0 20px rgba(0, 245, 155, 0.4);
    }
    
    body {
      background-color: var(--ink);
      background-image: radial-gradient(circle at 50% 0%, var(--ink-mid) 0%, transparent 70%);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
    }
    
    a, button, select, input, textarea {
      cursor: none;
    }
    
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--text-main);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }
    
    .cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.25s, height 0.25s, opacity 0.25s;
      opacity: 0.5;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 3rem;
      background: var(--glass-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: var(--shadow-luxury), var(--glass-specular);
      position: relative;
      z-index: 10;
    }
    
    h1 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 2.8rem;
      margin: 0 0 2rem 0;
      color: var(--text-main);
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    
    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 1.2rem;
      color: var(--text-main);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      border-radius: 8px;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    
    input:focus {
      border-color: var(--accent);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), var(--glow-emerald);
    }
    
    .btn {
      width: 100%;
      background: var(--accent);
      color: var(--ink);
      border: 1px solid var(--accent);
      padding: 1.1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 100px;
      margin-top: 1.5rem;
      cursor: none;
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      box-shadow: 0 10px 20px -10px rgba(0, 245, 155, 0.6);
    }
    
    .btn:hover {
      background: transparent;
      color: var(--accent);
      box-shadow: var(--glow-emerald);
      transform: translateY(-2px);
    }
    
    .link-text {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    
    .link-text:hover {
      color: var(--accent);
    }
    
    .error-msg, .success-msg {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .error-msg {
      background: rgba(255, 85, 85, 0.1);
      border: 1px solid #ff5555;
      color: #ff5555;
    }
    
    .success-msg {
      background: rgba(0, 245, 155, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    
    #forgotView {
      display: none;
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="login-container">
    <div id="loginView">
      <h1>Admin Panel</h1>
      <div id="loginError" class="error-msg">Invalid credentials.</div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position: relative; width: 100%;">
            <input type="password" id="password" required style="padding-right: 45px;">
            <span onclick="togglePwd('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-dim); font-size: 0.75rem; font-family: 'Space Mono', monospace; text-transform: uppercase; user-select: none;">Show</span>
          </div>
        </div>
        <button type="submit" class="btn" id="loginBtn">Login →</button>
      </form>
      <div class="link-text" onclick="toggleView('forgotView')">Forgot password?</div>
    </div>
    
    <div id="forgotView">
      <h1>Reset Password</h1>
      <div id="forgotSuccess" class="success-msg">Reset instructions sent.</div>
      <div id="forgotError" class="error-msg">Something went wrong.</div>
      <p style="font-size: 0.85rem; color: var(--text-dim); text-align: center; margin-bottom: 1.5rem;">Enter your username. If it exists, a reset link will be generated in the server console.</p>
      <form id="forgotForm" onsubmit="handleForgot(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="forgotUsername" required>
        </div>
        <button type="submit" class="btn" id="forgotBtn">Send Reset Link →</button>
      </form>
      <div class="link-text" onclick="toggleView('loginView')">← Back to login</div>
    </div>
  </div>

  <script>
    function toggleView(viewId) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('forgotView').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
      
      // Clear messages
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('forgotSuccess').style.display = 'none';
      document.getElementById('forgotError').style.display = 'none';
    }

    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = 'Hide';
      } else {
        input.type = 'password';
        btn.innerText = 'Show';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      
      btn.innerText = 'Logging in...';
      btn.disabled = true;
      
      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };
      
      try {
        const res = await fetch('%VITE_API_BASE_URL%/api/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok) {
          window.location.href = '/admin.html';
        } else {
          err.innerText = data.message || 'Invalid credentials.';
          err.style.display = 'block';
        }
      } catch (error) {
        err.innerText = 'Connection error.';
        err.style.display = 'block';
      } finally {
        btn.innerText = 'Login →';
        btn.disabled = false;
      }
    }
    
    async function handleForgot(e) {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      const succ = document.getElementById('forgotSuccess');
      const err = document.getElementById('forgotError');
      
      succ.style.display = 'none';
      err.style.display = 'none';
      
      btn.innerText = 'Sending...';
      btn.disabled = true;
      
      const payload = {
        username: document.getElementById('forgotUsername').value
      };
      
      try {
        const res = await fetch('%VITE_API_BASE_URL%/api/forgot_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok) {
          succ.innerText = data.message;
          succ.style.display = 'block';
        } else {
          err.innerText = data.message || 'An error occurred.';
          err.style.display = 'block';
        }
      } catch (error) {
        err.innerText = 'Connection error.';
        err.style.display = 'block';
      } finally {
        btn.innerText = 'Send Reset Link →';
        btn.disabled = false;
      }
    }

    // Cursor Logic
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX;
    let ringY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function renderRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(renderRing);
    }
    requestAnimationFrame(renderRing);
    
    function attachCursorEvents() {
      const interactables = document.querySelectorAll('button, a, .link-text, input');
      interactables.forEach(el => {
        if(el.dataset.cursorBound) return;
        el.dataset.cursorBound = "true";
        
        el.addEventListener('mouseenter', () => {
          cursor.style.width = '6px';
          cursor.style.height = '6px';
          ring.style.width = '56px';
          ring.style.height = '56px';
          ring.style.opacity = '0.8';
        });
        el.addEventListener('mouseleave', () => {
          cursor.style.width = '10px';
          cursor.style.height = '10px';
          ring.style.width = '36px';
          ring.style.height = '36px';
          ring.style.opacity = '0.5';
        });
      });
    }
    
    // Attach and re-attach when views change
    attachCursorEvents();
    const observer = new MutationObserver(attachCursorEvents);
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
