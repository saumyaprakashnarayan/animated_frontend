<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trayaksh.ai — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css">
  
  <style>
    :root {
      --bg-dark: #050505;
      --bg-panel: #0a0a0c;
      --border-color: rgba(255, 255, 255, 0.1);
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
    }
    
    a, button, select, input, textarea {
      cursor: none;
    }
    
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }
    
    .cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.25s, height 0.25s, opacity 0.25s;
      opacity: 0.5;
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    h1 {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 2.5rem;
      margin: 0 0 1.5rem 0;
      color: var(--accent);
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.8rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }
    
    input:focus {
      border-color: var(--accent);
    }
    
    .btn {
      width: 100%;
      background: var(--accent);
      color: var(--bg-dark);
      border: none;
      padding: 0.8rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 40px;
      margin-top: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    
    .btn:hover {
      background: white;
    }
    
    .error-msg, .success-msg {
      display: none;
      padding: 0.8rem;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .error-msg {
      background: rgba(255, 85, 85, 0.1);
      border: 1px solid #ff5555;
      color: #ff5555;
    }
    
    .success-msg {
      background: rgba(200, 255, 0, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="login-container">
    <div id="resetView">
      <h1>New Password</h1>
      <div id="resetError" class="error-msg">Error.</div>
      <div id="resetSuccess" class="success-msg">Password updated. <a href="/login.html" style="color: var(--accent); text-decoration: underline;">Login now</a></div>
      
      <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit" class="btn" id="resetBtn">Save Password →</button>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      document.getElementById('resetError').innerText = 'No reset token provided. Please use the link from the console.';
      document.getElementById('resetError').style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const err = document.getElementById('resetError');
      const succ = document.getElementById('resetSuccess');
      err.style.display = 'none';
      
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      
      if (newPass !== confirmPass) {
        err.innerText = 'Passwords do not match.';
        err.style.display = 'block';
        return;
      }
      
      btn.innerText = 'Saving...';
      btn.disabled = true;
      
      const payload = {
        token: token,
        password: newPass
      };
      
      try {
        const res = await fetch('/api/reset_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok) {
          succ.style.display = 'block';
          document.getElementById('resetForm').style.display = 'none';
        } else {
          err.innerText = data.message || 'Invalid or expired token.';
          err.style.display = 'block';
        }
      } catch (error) {
        err.innerText = 'Connection error.';
        err.style.display = 'block';
      } finally {
        btn.innerText = 'Save Password →';
        btn.disabled = false;
      }
    }

    // Cursor Logic
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX;
    let ringY = mouseY;
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });
    
    function renderRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(renderRing);
    }
    requestAnimationFrame(renderRing);
    
    function attachCursorEvents() {
      const interactables = document.querySelectorAll('button, a, input');
      interactables.forEach(el => {
        if(el.dataset.cursorBound) return;
        el.dataset.cursorBound = "true";
        
        el.addEventListener('mouseenter', () => {
          cursor.style.width = '6px';
          cursor.style.height = '6px';
          ring.style.width = '56px';
          ring.style.height = '56px';
          ring.style.opacity = '0.8';
        });
        el.addEventListener('mouseleave', () => {
          cursor.style.width = '10px';
          cursor.style.height = '10px';
          ring.style.width = '36px';
          ring.style.height = '36px';
          ring.style.opacity = '0.5';
        });
      });
    }
    
    attachCursorEvents();
  </script>
</body>
</html>
